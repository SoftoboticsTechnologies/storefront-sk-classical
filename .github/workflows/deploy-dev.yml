name: Deploy static export to S3 + CloudFront

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel token that triggered this deploy'
        required: false
        type: string
      envOverrides:
        description: 'JSON string of env var overrides for this deploy'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BUCKET: ${{ vars.AWS_BUCKET_DEV }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEV }}
      # NEXT_PUBLIC_* build-time vars (Vendure API URL/channel token, site
      # URL/name, Stripe publishable key) are NOT injected here — they come
      # from the committed .env.development (copied to .env.production.local
      # below so `next build` actually picks it up). See docs/decisions.md.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use .env.development for this build
        # `next build` always loads env files as if NODE_ENV=production, so it
        # never reads .env.development on its own (setting NODE_ENV=development
        # here would not change that - the file set Next loads is fixed to
        # build vs dev command, not the NODE_ENV value - and would also disable
        # production optimizations). .env.production.local has the highest
        # precedence in Next's env-file load order - above .env.local and
        # .env.production - so copying dev's values there is the only reliable
        # way to make this build use them instead.
        run: cp .env.development .env.production.local

      - name: Build static export
        run: npm run build
        # next.config.ts must have output: 'export' for this to emit an out/
        # directory (see docs/decisions.md, static-export migration entry) —
        # `next build` fails fast if that isn't set, so a misconfigured
        # branch never reaches the sync/invalidate steps below.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync static export to S3
        run: |
          aws s3 sync out "s3://${AWS_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
